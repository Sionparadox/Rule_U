name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check rule_u tests migrations
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      # test_committed_openapi_is_current가 openapi.json 갱신 누락을 검출합니다.
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # 구버전 Corepack의 서명 키 오류를 피하기 위해 최신으로 갱신합니다.
      - run: npm install -g corepack@latest && corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: Generated API types are current
        run: |
          corepack pnpm types:api
          git diff --exit-code -- apps/web/src/lib/api.generated.ts
      - run: corepack pnpm typecheck
      - run: corepack pnpm lint
      - run: corepack pnpm format:check
      - run: corepack pnpm build

  e2e:
    needs: [api, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g corepack@latest && corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: uv sync --frozen --project apps/api
      - run: corepack pnpm exec playwright install --with-deps chromium
      - run: corepack pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
